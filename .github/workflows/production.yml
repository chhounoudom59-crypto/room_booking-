# =====================================================================
# Production Workflow
# Triggers on prod-v* tags only
# Purpose: Final gate — strict CI then push production Docker image
# =====================================================================
name: Production CI/CD

on:
  push:
    tags:
      - "prod-v*"

env:
  IMAGE: 12345chhounoudom/intelligent_room_booking

jobs:
  # ── Job 1: Strict CI for production gate ────────────────────────
  production-ci:
    name: Production CI Gate
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: room_booking_system.settings
      SECRET_KEY: ci-secret-key-production
      DEBUG: "False"
      USE_SQLITE: "True"
      AI_ENABLED: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.ci.txt
          pip install pytest pytest-cov pytest-django ruff

      - name: Django system check
        run: python manage.py check

      - name: Lint with Ruff (strict)
        run: ruff check .

      - name: Format check with Ruff
        run: ruff format --check .

      - name: Run full test suite (production gate)
        run: |
          pytest \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-coverage-report
          path: coverage.xml

  # ── Job 2: Build & push production Docker image ─────────────────
  production-docker:
    name: Build Production Docker Image
    needs: production-ci
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version from tag
        id: extract
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/prod-v}"
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:prod-${{ steps.extract.outputs.VERSION }}
            ${{ env.IMAGE }}:production
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          {
            echo "## 🚀 Production Image Pushed"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Image | \`${{ env.IMAGE }}:prod-${{ steps.extract.outputs.VERSION }}\` |"
            echo "| Alias | \`${{ env.IMAGE }}:production\`, \`${{ env.IMAGE }}:latest\` |"
            echo "| Docker Hub | https://hub.docker.com/r/12345chhounoudom/intelligent_room_booking |"
          } >> $GITHUB_STEP_SUMMARY
