# =====================================================================
# Dev Branch Workflow
# Triggers on push/PR to: dev, develop, feature/* branches
# Purpose: Fast CI check for feature development
# =====================================================================
name: Dev Branch CI

on:
  push:
    branches:
      - "dev"
      - "develop"
      - "feature/**"
  pull_request:
    branches:
      - "dev"
      - "develop"
      - "main"

jobs:
  django-ci:
    name: Django CI (Dev)
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: room_booking_system.settings
      SECRET_KEY: ci-secret-key-dev
      DEBUG: "True"
      USE_SQLITE: "True"
      AI_ENABLED: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.ci.txt
          pip install pytest pytest-cov pytest-django ruff

      - name: Django system check
        run: python manage.py check

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests
        run: |
          pytest \
            --cov=. \
            --cov-report=term-missing \
            --cov-fail-under=40 \
            -v

      - name: Job summary
        run: |
          {
            echo "## ✅ Dev CI Passed"
            echo "Branch: \`${{ github.ref_name }}\`"
            echo "Commit: \`${{ github.sha }}\`"
          } >> $GITHUB_STEP_SUMMARY
