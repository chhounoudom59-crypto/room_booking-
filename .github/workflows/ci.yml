# =====================================================================
# CI Workflow — Django CI
# Runs on every push/PR to main branch
# Checks: lint (Ruff), format, Django system check, unit tests + coverage
# =====================================================================
name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Django backend — lint, format, system-check, unit tests
  # ─────────────────────────────────────────────────────────────────
  django-test:
    name: Django Tests & Lint
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: room_booking_system.settings
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "False"
      USE_SQLITE: "True"          # SQLite — no MySQL server needed in CI
      AI_ENABLED: "False"         # Disable heavy AI subsystems during CI
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python setup with pip caching ──────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.ci.txt

      # ── 3. Install lightweight CI dependencies ────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.ci.txt
          pip install pytest pytest-cov pytest-django ruff

      # ── 4. Environment debug info ─────────────────────────────────
      - name: Environment info
        run: |
          python -V
          pip --version
          pip list

      # ── 5. Django system check ────────────────────────────────────
      - name: Django system check
        run: python manage.py check

      # ── 6. Ruff lint ──────────────────────────────────────────────
      - name: Lint with Ruff
        run: ruff check .

      # ── 7. Ruff format check ──────────────────────────────────────
      - name: Format check with Ruff
        run: ruff format --check .

      # ── 8. Unit tests with coverage ───────────────────────────────
      - name: Run unit tests
        run: |
          pytest \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            -v

      # ── 9. Upload coverage artifact ───────────────────────────────
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
