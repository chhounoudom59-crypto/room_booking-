# =====================================================================
# CI Workflow — Django CI
# Runs on every push/PR to main branch
# Checks: lint (Ruff), format, Django system check, unit tests + coverage
# =====================================================================
name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Django backend — lint, format, system-check, unit tests
  # ─────────────────────────────────────────────────────────────────
  django-test:
    name: Django Tests & Lint
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: room_booking_system.settings
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "False"
      USE_SQLITE: "True"          # SQLite — no MySQL server needed in CI
      AI_ENABLED: "False"         # Disable heavy AI subsystems during CI
      ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python setup with pip caching ──────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.ci.txt

      # ── 3. Install lightweight CI dependencies ────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.ci.txt
          pip install pytest pytest-cov pytest-django ruff

      # ── 4. Environment debug info ─────────────────────────────────
      - name: Environment info
        run: |
          python -V
          pip --version
          pip list

      # ── 5. Django system check ────────────────────────────────────
      - name: Django system check
        run: python manage.py check

      # ── 6. Ruff lint ──────────────────────────────────────────────
      - name: Lint with Ruff
        run: ruff check .

      # ── 7. Ruff format check ──────────────────────────────────────
      - name: Format check with Ruff
        run: ruff format --check .

      # ── 8. Unit tests with coverage ───────────────────────────────
      - name: Run unit tests
        run: |
          pytest \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            -v

      # ── 9. Upload coverage artifact ───────────────────────────────
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ═══════════════════════════════════════════════════════════════════
  # Job 2: Unity Client — EditMode Unit Tests (runs PARALLEL to django-test)
  #
  # Uses GameCI (https://game.ci) — the standard for Unity in GitHub Actions.
  # GameCI pulls an official Unity Docker image matching your ProjectVersion.txt,
  # activates a Unity Personal license, then runs C# NUnit tests.
  #
  # Required GitHub Secrets (Settings → Secrets → Actions):
  #   UNITY_EMAIL    → Your Unity account email
  #   UNITY_PASSWORD → Your Unity account password
  #   (No .ulf file needed for Unity Personal license)
  # ═══════════════════════════════════════════════════════════════════
  unity-test:
    name: Unity EditMode Tests
    runs-on: ubuntu-latest   # GameCI Ubuntu images support Unity headlessly

    steps:
      # ── 1. Checkout the repository ────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history so Unity's version-control features work
          fetch-depth: 0
          # Use LFS if you store large binary assets (textures, audio, etc.)
          lfs: true

      # ── 2. Cache Unity Library folder ─────────────────────────────
      # The Library/ folder is Unity's import cache. Caching it between runs
      # can reduce Unity startup time from ~10 min → ~2 min on repeated builds.
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity_client/Library
          # Cache key is tied to the project folder and OS
          key: Library-unity_client-ubuntu-${{ hashFiles('unity_client/Assets/**', 'unity_client/Packages/**', 'unity_client/ProjectSettings/**') }}
          restore-keys: |
            Library-unity_client-ubuntu-
            Library-unity_client-

      # ── 3. Run Unity EditMode Tests ───────────────────────────────
      # game-ci/unity-test-runner@v4 handles:
      #   • Pulling the correct Unity Docker image (from ProjectVersion.txt)
      #   • Activating your Unity license using the secrets
      #   • Running all NUnit tests under Assets/Tests/EditMode/
      #   • Outputting an XML test results file (NUnit format)
      - name: Run Unity EditMode Tests
        uses: game-ci/unity-test-runner@v4
        id: unity-tests      # 'id' lets us reference outputs (e.g. artifactsPath) below
        env:
          # ── Unity Personal License ────────────────────────────────
          # For a free Unity Personal account: only email + password needed.
          # GameCI activates the license automatically via Unity's auth server.
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # Path to the Unity project root (contains Assets/, ProjectSettings/, etc.)
          projectPath: unity_client

          # Unity version must match ProjectSettings/ProjectVersion.txt
          unityVersion: 2022.3.21f1

          # testMode options: EditMode | PlayMode | All
          # EditMode = fast, no Play Mode runtime needed (best for CI)
          testMode: EditMode

          # Where to store the NUnit XML test results
          artifactsPath: unity-test-results

          # Fail this step if ANY test fails
          checkName: Unity EditMode Test Results

          # Optional: copy test results to GitHub's test-results UI
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Upload Test Results as Artifact ────────────────────────
      # 'if: always()' ensures results are uploaded even when tests fail,
      # so you can download and inspect the NUnit XML report.
      - name: Upload Unity test results
        uses: actions/upload-artifact@v4
        if: always()   # Upload even on test failure for debugging
        with:
          name: unity-test-results
          # steps.unity-tests.outputs.artifactsPath is set by unity-test-runner
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
