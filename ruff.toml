# Ruff Configuration for Intelligent Room Booking

target-version = "py311"
line-length = 120

[lint]
# Enable standard rules
select = ["E", "F", "W", "I", "N", "S", "B", "A", "C4", "T20", "RET", "SIM", "PLC", "PLE", "PLW", "RUF"]
ignore = [
    "E501", # Line too long (handled by formatter)
    "S101", # Use of `assert` is fine in tests
    "RET505", # Unnecessary `elif` after `return`
]

[lint.per-file-ignores]
"**/tests/*" = ["S101", "F401"]
"**/tests.py" = ["S101", "F401"]
"manage.py" = ["PLR0913"]

[lint.mccabe]
max-complexity = 15

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "migrations",
]
