services:
  db:
    image: mysql:8.0
    container_name: room_booking_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: room_booking_backup
      MYSQL_USER: rith
      MYSQL_PASSWORD: rith1234
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build: .
    container_name: room_booking_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=room_booking_backup
      - DB_USER=rith
      - DB_PASSWORD=rith1234
      - USE_SQLITE=False
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./media:/app/media

volumes:
  mysql_data:
  static_volume:
  media_volume:
